flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 16
  web:
    generate: true
    image_path: web/favicon.png
    background_color: "#000000"
    theme_color: "#fffff"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
