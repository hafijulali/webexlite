name: webexlite
version: 0.0.8
publish_to: none
environment:
  sdk: ">=3.1.3 <4.0.0"
description: Reimplimentation of webex app in flutter, designed for performance
dependencies:
  archive: ^4.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.5
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  hive_ce: ^2.12.0
  hive_ce_flutter: ^2.3.2
  keymap: ^0.0.92
  packer:
    git:
      url: https://gitlab.com/hafijulali/packer
      ref: v0.1.13
  path: ^1.9.1
  path_provider: ^2.1.5
  timezone: ^0.10.1
  url_launcher: ^6.3.2
  app_links: ^3.5.0
  pkce: ^1.1.0
  uuid: ^4.5.1
  webexapis:
    path:
      ../webexapis
      #url: https://gitlab.com/hafijulali/webexapis
      #ref: v0.0.4
dev_dependencies:
  build_runner: ^2.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.5
  lints: ^6.0.0
  pubspec_dependency_sorter: ^1.0.5
flutter:
  uses-material-design: true
  assets:
    - .env
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 16
  web:
    generate: true
    image_path: web/favicon.png
    background_color: "#000000"
    theme_color: "#fffff"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icons/app_icon.png
