name: webexlite
version: 0.0.9
publish_to: none
environment:
  sdk: ">=3.1.3 <4.0.0"
description: Reimplimentation of webex app in flutter, designed for performance
dependencies:
  archive: ^4.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.0.5
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  bloc: ^9.1.0
  hive_ce: ^2.2.3
  hive_ce_flutter: ^1.1.0
  keymap: ^0.0.92
  packer:
    path: ../packer/
    #git:
    # url: https://gitlab.com/hafijulali/packer
    # ref: v0.1.15
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.0.0
  timezone: ^0.10.1
  url_launcher: ^6.3.2

  pkce: ^1.1.0
  uuid: ^4.5.1
  webexapis:
    path:
      ../webexapis
      #url: https://gitlab.com/hafijulali/webexapis
      #ref: v0.0.4
  intl: any

  app_links: ^6.4.1
  universal_html: ^2.2.0

dev_dependencies:
  build_runner: ^2.8.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.5

  lints: ^6.0.0
  pubspec_dependency_sorter: ^1.0.5
  mockito: ^5.0.0 # Add mockito for testing
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/config.json
flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icons/app_icon.png
  min_sdk_android: 16
  web:
    generate: true
    image_path: web/favicon.png
    background_color: "#000000"
    theme_color: "#fffff"
  windows:
    generate: true
    image_path: assets/icons/app_icon.png
    icon_size: 48
  macos:
    generate: true
    image_path: assets/icons/app_icon.png

